name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Show versions
        run: gradle --version

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-output.txt

      - name: Save failure log to branch
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --detach
          tail -c 300000 gradle-output.txt > failure-log.txt
          git add failure-log.txt
          git commit -m "failure log for run ${GITHUB_RUN_ID}"
          git push origin HEAD:failure-logs --force

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotspotScheduler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
