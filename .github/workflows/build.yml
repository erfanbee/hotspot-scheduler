name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee gradle-output.txt

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee -a gradle-output.txt
          gradle_exit=${PIPESTATUS[0]}
          echo "gradle exit code: $gradle_exit" >> gradle-output.txt
          if [ "$gradle_exit" -ne 0 ]; then
            echo "BUILD_FAILED=true" >> "$GITHUB_ENV"
          fi

      - name: Save failure log to branch
        if: failure() || env.BUILD_FAILED == 'true'
        run: |
          set -x
          ls -la gradle-output.txt
          rm -rf /tmp/logrepo
          mkdir -p /tmp/logrepo
          cp gradle-output.txt /tmp/logrepo/failure-log.txt
          cd /tmp/logrepo
          git init
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add failure-log.txt
          git commit -m "failure log for run ${GITHUB_RUN_ID}"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:failure-logs --force

      - name: Fail the run if build failed
        if: env.BUILD_FAILED == 'true'
        run: |
          echo "Build failed. See failure-logs branch for the full log."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotspotScheduler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Build $TAG" \
            --notes "Automated APK build" \
            --repo "${{ github.repository }}" \
            || gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber --repo "${{ github.repository }}"
